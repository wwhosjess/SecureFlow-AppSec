name: AppSec checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-tools.txt
      - run: pip install -r requirements-tools.txt
      - name: Test the custom Semgrep rule
        run: semgrep --test --config rules/unsafe-sql.yaml rules/unsafe-sql.py
      - name: Scan vulnerable fixture and verify expected failures
        run: |
          set +e
          python security_scan.py --mode vulnerable
          scan_exit=$?
          set -e
          test "$scan_exit" -eq 1
          python - <<'PY'
          import json
          r = json.load(open('reports/vulnerable/summary.json'))
          assert r['gate'] == 'findings', r
          assert all(s['status'] == 'completed' for s in r['scans'].values()), r
          assert r['scans']['sast']['finding_count'] >= 1
          assert r['scans']['sca']['finding_count'] >= 1
          assert r['scans']['dast']['finding_count'] >= 4
          assert r['regression']['status'] == 'pass'
          PY
      - name: Enforce fixed-fixture gate
        run: python security_scan.py --mode fixed
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: reports/
